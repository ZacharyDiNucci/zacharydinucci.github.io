<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WebGLPortfolio</title>
    <script>
      // All paths below are relative ("Build/...", "TemplateData/..."), so the page must be
      // loaded as ".../folder/", not ".../folder". Add the slash if a host didn't.
      if (!location.pathname.endsWith("/") && !location.pathname.endsWith(".html"))
        location.replace(location.pathname + "/" + location.search + location.hash);
    </script>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="loader">
      <div id="loader-title">WebGLPortfolio</div>
      <div id="loader-bar"><div id="loader-fill"></div></div>
      <div id="loader-error" hidden></div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loader = document.querySelector("#loader");
      var fill = document.querySelector("#loader-fill");
      var errorBox = document.querySelector("#loader-error");

      function showError(message) {
        errorBox.textContent = message;
        errorBox.hidden = false;
        loader.classList.add("failed");
      }

      // Unity calls this for warnings/errors. Only errors are shown to visitors.
      function unityShowBanner(msg, type) {
        if (type === "error") showError(msg);
        else console.warn(msg);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Unity Builds.data.unityweb",
        frameworkUrl: buildUrl + "/Unity Builds.framework.js.unityweb",
        codeUrl: buildUrl + "/Unity Builds.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "WebGLPortfolio",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // Keep the backbuffer the same size as the CSS canvas (no stretching on resize)...
        matchWebGLToCanvasSize: true,
        // ...but cap the pixel ratio: 3x phone screens would otherwise render 9x the pixels.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/Unity Builds.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (100 * progress) + "%";
        }).then(function () {
          loader.remove();
          canvas.focus();
        }).catch(function (message) {
          showError(String(message));
        });
      };
      script.onerror = function () {
        showError("Could not load " + script.src);
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
